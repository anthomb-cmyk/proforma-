<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141C" />
    <meta name="description" content="SOCLE Acquisitions — Quebec real estate acquisitions CRM" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <!-- iOS Add-to-Home-Screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SOCLE" />

    <title>SOCLE Acquisitions</title>
    <!-- Prevent browser back/forward swipe gesture and rubber-band bounce.
         Applied early (before React CSS) so it takes effect on first paint.
         overscroll-behavior-x:none is the key property — overflow-x:hidden
         alone does not suppress the horizontal navigation gesture on iOS/Chrome. -->
    <style>
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        overflow-x: hidden;
      }
      #root {
        touch-action: pan-y;
        overscroll-behavior: none;
      }
      /* No text-selection flash on UI chrome; textarea/input are unaffected. */
      button, a, nav, [role="tab"] {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
    <!--
      Leaflet is only loaded on non-phone devices (viewport > 760px OR
      coarse-pointer-free). On phones it's skipped entirely — saves ~150 KB
      on every page load and stops the tile layer from eating CPU/battery on
      devices that never show the map. The React app detects missing
      window.L and hides every map UI on phones anyway.
    -->
    <script>
      (function () {
        try {
          var w = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var isPhone = w <= 760;
          if (!isPhone) {
            var css = document.createElement("link");
            css.rel = "stylesheet";
            css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
            document.head.appendChild(css);
            var js = document.createElement("script");
            js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
            js.async = false;
            document.head.appendChild(js);
          }
        } catch (e) { /* non-fatal — app falls back to "map lib not loaded" */ }
      })();
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
